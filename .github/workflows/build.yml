name: Build Windows Desktop App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup & Copy FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --confirm
          $ffmpegPath = (Get-Command ffmpeg).Source
          Copy-Item $ffmpegPath -Destination ./ffmpeg.exe
          Write-Host "FFmpeg binary prepared at ./ffmpeg.exe"

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean build.spec

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          # 檢查檔案是否存在
          if (Test-Path "dist/VoiceClarityStudio.exe") {
            Compress-Archive -Path dist/VoiceClarityStudio.exe -DestinationPath VoiceClarityStudio-Windows.zip
          } else {
            Write-Error "dist/VoiceClarityStudio.exe not found!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceClarityStudio-Windows
          path: VoiceClarityStudio-Windows.zip
