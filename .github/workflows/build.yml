name: Build Windows Desktop App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 直接執行 PyInstaller 打包
      - name: Build with PyInstaller
        run: |
          pyinstaller --clean build.spec

      # 只壓縮產生的 exe 檔案
      - name: Package Windows Artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/VoiceClarityStudio.exe")) {
            Write-Error "dist/VoiceClarityStudio.exe was not created!"
            exit 1
          }
          Compress-Archive -Path dist/VoiceClarityStudio.exe -DestinationPath VoiceClarityStudio-Windows.zip
          Write-Host "Successfully packaged VoiceClarityStudio-Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceClarityStudio-Windows
          path: VoiceClarityStudio-Windows.zip
