name: Build Desktop App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊觸發

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: VoiceClarityStudio-Windows.zip
            executable_path: dist/VoiceClarityStudio.exe
            ffmpeg_cmd: |
              curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
              tar -xf ffmpeg.zip
              copy ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe .
          - os: macos-latest
            artifact_name: VoiceClarityStudio-macOS.zip
            executable_path: dist/VoiceClarityStudio.app
            ffmpeg_cmd: |
              curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/zip
              unzip ffmpeg.zip
              chmod +x ffmpeg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download & Prepare Bundled FFmpeg
        run: ${{ matrix.ffmpeg_cmd }}
        shell: bash

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean build.spec

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/VoiceClarityStudio.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }} VoiceClarityStudio.app
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
