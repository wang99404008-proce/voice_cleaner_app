name: Build Desktop App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: VoiceClarityStudio-Windows.zip
          - os: macos-latest
            artifact_name: VoiceClarityStudio-macOS.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # macOS: GitHub runner 預設已內建 ffmpeg，若無則用 brew 安裝，並複製到當前目錄供打包
      - name: Setup & Copy FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            brew install ffmpeg
          fi
          cp $(which ffmpeg) ./ffmpeg
          chmod +x ./ffmpeg

      # Windows: GitHub runner 內建 choco，直接安裝並複製 ffmpeg.exe 到當前目錄
      - name: Setup & Copy FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --confirm
          $ffmpegPath = (Get-Command ffmpeg).Source
          Copy-Item $ffmpegPath -Destination ./ffmpeg.exe

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean build.spec

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VoiceClarityStudio.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }} VoiceClarityStudio.app
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
