name: Build Desktop App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: VoiceClarityStudio-Windows.zip
          - os: macos-latest
            artifact_name: VoiceClarityStudio-macOS.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 使用官方維護的 action 安裝穩定版 FFmpeg
      - name: Setup FFmpeg
        uses: Federik/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 將 runner 安裝好的 ffmpeg 複製到當前工作目錄，供 PyInstaller 打包
      - name: Copy FFmpeg binary for packaging (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp $(which ffmpeg) ./ffmpeg.exe

      - name: Copy FFmpeg binary for packaging (macOS)
        if: runner.os == 'macOS'
        run: |
          cp $(which ffmpeg) ./ffmpeg
          chmod +x ./ffmpeg

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean build.spec

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VoiceClarityStudio.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }} VoiceClarityStudio.app
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
